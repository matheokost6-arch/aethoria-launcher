# Verification du launcher sur de vraies machines macOS et Linux.
#
# Sur chacune : parcours complet d'un joueur (pseudo, JOUER, installation de
# Java, Forge, Minecraft et du modpack, jeu jusqu'au menu), puis ouverture de
# l'application compilee. Resultats et captures d'ecran dans l'artefact
# "verification-<machine>".
#
# Windows est verifie en vrai sur le PC de developpement : les machines Windows
# de GitHub n'ont pas de carte graphique, Minecraft ne peut pas s'y afficher.

name: Verification multiplateforme

on:
  workflow_dispatch:
    inputs:
      systemes:
        description: Machines a verifier
        type: choice
        default: tous
        options: [tous, linux, mac]

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            nom: linux-ubuntu-22.04
          - os: ubuntu-24.04
            nom: linux-ubuntu-24.04
          - os: macos-latest
            nom: mac-apple-silicon
          - os: macos-15-intel
            nom: mac-intel

    if: ${{ inputs.systemes == 'tous' || (inputs.systemes == 'linux' && startsWith(matrix.os, 'ubuntu')) || (inputs.systemes == 'mac' && startsWith(matrix.os, 'macos')) }}
    runs-on: ${{ matrix.os }}
    # Rien a ecrire sur GitHub : un script de dependance ne doit pas pouvoir
    # se servir du jeton de la construction.
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Linux : ecran virtuel, rendu OpenGL logiciel (Mesa) et son factice,
      # comme un PC sans carte graphique ni haut-parleurs.
      - name: Ecran et son virtuels (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri pulseaudio rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          Xvfb :99 -screen 0 1600x900x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true

      - name: Parcours du joueur, jusqu'au menu du jeu
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx electron --no-sandbox tests/verification.js
          else
            npx electron tests/verification.js
          fi

      - name: Construire les paquets
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx electron-builder --linux deb rpm AppImage tar.gz --x64 --publish never
            ls -la dist/*.deb dist/*.rpm dist/*.AppImage dist/*.tar.gz
          else
            npx electron-builder --mac --dir --publish never
          fi

      - name: Ouvrir l'application compilee
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then
            APP=$(ls -d dist/mac*/Aethoria.app | head -1)
            npx electron tests/app-compilee.js macos "$APP/Contents/MacOS/Aethoria" || true
            exit 0
          fi
          # 1. Le paquet .deb, comme un joueur sous Debian ou Ubuntu.
          sudo apt-get install -y ./dist/Aethoria-linux-amd64.deb
          ls -l /opt/Aethoria/chrome-sandbox
          npx electron --no-sandbox tests/app-compilee.js deb /opt/Aethoria/aethoria || true
          # 2. L'AppImage lancee directement, sans aucune option.
          npx electron --no-sandbox tests/app-compilee.js appimage "$PWD/dist/Aethoria-linux-x86_64.AppImage" || true
          # 3. L'archive .tar.gz, decompressee a la main.
          mkdir -p /tmp/aethoria-targz && tar -xzf dist/Aethoria-linux-x64.tar.gz -C /tmp/aethoria-targz
          npx electron --no-sandbox tests/app-compilee.js targz "$(ls -d /tmp/aethoria-targz/*/aethoria | head -1)" || true

      - name: Le paquet .rpm dans un vrai Fedora
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD/dist:/paquets" fedora:41 bash -lc '
            set -e
            dnf install -y -q /paquets/Aethoria-linux-x86_64.rpm > /dev/null
            test -x /opt/Aethoria/aethoria && echo "OK    .rpm installe sur Fedora : /opt/Aethoria/aethoria"
            ls -l /opt/Aethoria/chrome-sandbox
            test -f /usr/share/applications/aethoria.desktop && echo "OK    raccourci du menu installe"
          ' | tee -a verification/resume.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.nom }}
          retention-days: 7
          path: verification/
