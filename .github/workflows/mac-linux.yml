# Versions macOS et Linux du launcher.
#
# Elles ne peuvent pas etre construites depuis Windows : GitHub s'en charge sur
# de vraies machines macOS et Linux et garde les fichiers construits.
#
# "npm run deploy" declenche cette construction, attend qu'elle finisse,
# recupere les fichiers et les ajoute lui-meme a la release publique. Aucun
# jeton a configurer : GitHub ne fait que construire.

name: Versions macOS et Linux

on:
  workflow_dispatch:

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nom: mac
            cible: --mac
          - os: ubuntu-latest
            nom: linux
            cible: --linux

    runs-on: ${{ matrix.os }}
    # Rien a ecrire sur GitHub : un script de dependance ne doit pas pouvoir
    # se servir du jeton de la construction.
    permissions:
      contents: read
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Le format .rpm (Fedora, RHEL, openSUSE) a besoin de l'outil rpmbuild.
      - name: Outils de paquetage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Construire
        run: npx electron-builder ${{ matrix.cible }} --publish never

      # Les fichiers restent ici : "npm run deploy" les telecharge et les publie.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Aethoria-mac-*.dmg
            dist/Aethoria-mac-*.zip
            dist/latest-mac.yml
            dist/Aethoria-linux-*.AppImage
            dist/Aethoria-linux-*.deb
            dist/Aethoria-linux-*.rpm
            dist/Aethoria-linux-*.tar.gz
            dist/latest-linux.yml
            dist/latest-linux-arm64.yml
