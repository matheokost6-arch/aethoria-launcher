appId: fr.aethoria.launcher
productName: Aethoria
copyright: Copyright © 2026 Aethoria

directories:
  output: dist
  buildResources: build

# Seuls les fichiers reellement necessaires a l'execution sont embarques :
# inutile d'alourdir l'installateur avec les sources de developpement.
files:
  - src/**/*
  - package.json
  # L'icone est referencee a l'execution par les fenetres du launcher. Sans
  # elle dans le paquet, Electron journalise "Failed to load image from path"
  # et les fenetres s'affichent sans icone chez les joueurs.
  - build/icon.ico
  - build/icon.png
  - '!**/*.map'
  - '!**/.git/**'

win:
  target:
    # Installateur seul. La version portable a ete retiree : exe auto-extractible
    # non signe, elle est plus souvent signalee par les antivirus et ne se met
    # pas a jour toute seule.
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Nom fige, sans numero de version : le lien de telechargement
  # .../releases/latest/download/Aethoria-Setup.exe reste ainsi valable pour
  # toujours et peut etre mis en dur sur un site. Avec un nom versionne, il
  # faudrait modifier le site a chaque publication.
  artifactName: Aethoria-Setup.${ext}

nsis:
  oneClick: false                    # laisse le joueur choisir le dossier
  perMachine: false                  # installation utilisateur : pas de demande admin
  allowToChangeInstallationDirectory: true
  # "always" et non "true" : avec true, le raccourci n'est pas recree lors d'une
  # mise a jour si le joueur l'avait supprime, et certaines installations
  # silencieuses le sautent. "always" garantit sa presence a chaque fois.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: false
  runAfterFinish: true
  shortcutName: Aethoria
  deleteAppDataOnUninstall: false     # on ne supprime jamais les sauvegardes du joueur
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

mac:
  target:
    # dmg pour installer, zip pour les mises a jour automatiques.
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.games
  # Application non signee : Gatekeeper demandera au joueur de confirmer
  # l'ouverture la premiere fois (clic droit, Ouvrir).
  identity: null
  notarize: false
  artifactName: Aethoria-mac-${arch}.${ext}

dmg:
  title: Aethoria

linux:
  target:
    # AppImage : un seul fichier a rendre executable, valable sur toutes les
    # distributions. Le .deb sert a Debian, Ubuntu et Mint.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Game
  synopsis: Launcher du serveur Minecraft Aethoria
  maintainer: Aethoria <aethoria-mc@users.noreply.github.com>
  executableName: aethoria

# Noms figes, sans numero de version ni nom d'architecture : les liens de
# telechargement restent valables d'une version a l'autre. (Sans cela,
# electron-builder ecrirait x86_64 pour l'AppImage et amd64 pour le .deb.)
appImage:
  artifactName: Aethoria-linux-x64.AppImage

deb:
  artifactName: Aethoria-linux-x64.deb

# Mises a jour automatiques via les Releases GitHub.
# Remplace owner/repo par les tiens (ils doivent correspondre a src/shared/config.js).
# Les mises a jour sont cherchees sur le depot PUBLIC : le launcher installe
# chez un joueur n'a aucun moyen de lire un depot prive.
publish:
  provider: github
  owner: aethoria-mc
  repo: aethoria
  releaseType: release

compression: maximum
